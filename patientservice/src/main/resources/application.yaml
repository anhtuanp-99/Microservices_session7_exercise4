spring:
  application:
    name: patient-service

  config:
    import: "configserver:http://localhost:8888"
    cloud:
      config:
        fail-fast: true
        retry:
          initial-interval: 1000
          max-attempts: 6
          max-interval: 2000
          multiplier: 1.5

# ===== ACTUATOR =====
management:
  endpoints:
    web:
      exposure:
        # Mở endpoint /actuator/refresh (mặc định bị tắt)
        include: refresh, health, info
  endpoint:
    health:
      show-details: always